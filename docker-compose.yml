services:
  db:
    image: postgres:17-alpine
    container_name: sawaari-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sawaari
      POSTGRES_PASSWORD: sawaari
      POSTGRES_DB: sawaari
    ports:
      - "5432:5432"
    volumes:
      - sawaari_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawaari -d sawaari"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sawaari_pgdata:
